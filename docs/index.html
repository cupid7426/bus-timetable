<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赤羽駅行きバス</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#1c2530;--sub:#6b7785;--line:#e3e8ee;--accent:#329231;--now:#fff3c4}
@media (prefers-color-scheme:dark){:root{--bg:#12161b;--card:#1b2128;--fg:#e8edf2;--sub:#8c98a6;--line:#2a323b;--now:#4a4115}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:12px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=time]{font-size:28px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 12px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bus{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.bus:last-child{border:0}
.bus.near{background:var(--now);margin:0 -14px;padding:10px 14px}
.bus.past{opacity:.45}
.t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.no{width:2.1em;height:2.1em;font-size:16px;line-height:1;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.info{min-width:0;flex:1 1 9em;overflow-wrap:anywhere;font-size:13px;color:var(--sub);line-height:1.3}
.info b{color:var(--fg);font-size:15px}
.empty{color:var(--sub);text-align:center;padding:16px}
.legend{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.legend .no{width:1.6em;height:1.6em;font-size:14px}
#map{height:300px;border-radius:10px;border:1px solid var(--line)}
.pin{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;border:3px solid #fff;display:grid;place-items:center;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.edit .pin{background:#d9480f}
details summary{cursor:pointer;font-weight:700}
textarea{width:100%;height:90px;font:12px monospace}
.logo{text-align:center;margin:0 0 12px}
.logo img{max-width:60%;height:auto;border-radius:6px}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<main>
  <div class="logo"><img src="logo.png" alt="MEGATIME" width="672" height="152"></div>
  <h1>🚌 赤羽駅行きバス</h1>
  <div class="sub" id="meta"></div>
  <div class="card">
    <div class="row">
      <input type="time" id="time">
      <button id="nowBtn">今</button>
      <button id="m10">−10分</button><button id="p10">+10分</button>
    </div>
    <div class="row" style="margin-top:10px" id="days"></div>
    <div class="sub" style="margin-top:8px">希望時刻の <span id="range"></span> に発車するバスを表示</div>
  </div>
  <div class="card" id="list"></div>
  <div class="card">
    <details open>
      <summary>📍 バス停の場所</summary>
      <div id="map" style="margin-top:10px"></div>
      <div id="legend" style="margin-top:8px"></div>
      <div class="sub">地図上の位置は目安です。ズレていたら下の「位置を調整」で動かせます。</div>
      <button id="editBtn" style="margin-top:8px">位置を調整</button>
      <div id="editBox" hidden style="margin-top:8px">
        <div class="sub">ピンをドラッグして実際の場所に合わせてください（この端末に保存されます）。他の端末にも反映したい場合は下の文字を開発者に渡してください。</div>
        <textarea id="posOut" readonly></textarea>
        <button id="resetBtn">調整をリセット</button>
      </div>
    </details>
  </div>
  <div class="sub" id="stops"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const BEFORE=10, AFTER=30;
const DAY_LABEL={weekday:"平日",saturday:"土曜",holiday:"日祝"};
let DATA, dayType, override=null;

const jstNow=()=>{const p=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",dateStyle:"short",timeStyle:"short"}).format(new Date());return {date:p.slice(0,10),time:p.slice(11,16)}};
const toMin=s=>+s.slice(0,2)*60+ +s.slice(3,5);
const fmt=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

function autoDay(date){
  if(DATA.holidays.includes(date)) return "holiday";
  const w=new Date(date+"T00:00:00Z").getUTCDay(); // 日付文字列からの曜日(TZ非依存)
  return w===0?"holiday":w===6?"saturday":"weekday";
}
function render(){
  const {date}=jstNow();
  const auto=autoDay(date);
  dayType=override||auto;
  document.getElementById("days").innerHTML=Object.entries(DAY_LABEL).map(([k,v])=>
    `<button data-d="${k}" class="${k===dayType?"on":""}">${v}${k===auto?"（本日）":""}</button>`).join("");
  const t=toMin(document.getElementById("time").value||"00:00");
  document.getElementById("range").textContent=`${fmt(Math.max(0,t-BEFORE))}〜${fmt(Math.min(1439,t+AFTER))}`;
  const rows=DATA.timetable[dayType].filter(b=>{const m=toMin(b.time);return m>=t-BEFORE&&m<=t+AFTER});
  let nearest=null,best=1e9;
  rows.forEach(b=>{const d=Math.abs(toMin(b.time)-t);if(d<best){best=d;nearest=b}});
  document.getElementById("list").innerHTML=rows.length?rows.map(b=>
    `<div class="bus ${b===nearest?"near":""} ${toMin(b.time)<t?"past":""}">
      <div class="t">${b.time}</div><div class="no">${b.stop}</div>
      <div class="info"><b>${DATA.stops[b.stop]}</b>（${b.stop}番）<br>${b.line} ${b.dest}</div></div>`).join("")
    :`<div class="empty">この時間帯のバスはありません</div>`;
}
document.getElementById("days").addEventListener("click",e=>{const d=e.target.dataset.d;if(d){override=d===autoDay(jstNow().date)?null:d;render()}});
const timeEl=document.getElementById("time");
const shift=d=>{timeEl.value=fmt(Math.min(1439,Math.max(0,toMin(timeEl.value)+d)));render()};
document.getElementById("nowBtn").onclick=()=>{timeEl.value=jstNow().time;render()};
document.getElementById("m10").onclick=()=>shift(-10);
document.getElementById("p10").onclick=()=>shift(10);
timeEl.addEventListener("input",render);
/* ---- 地図 ---- */
let map, markers={}, editing=false;
const OFFS={1:[.00012,-.00022],2:[-.00022,.0],3:[-.00012,.00018],4:[.00012,.0001],5:[-.00012,-.0001]}; // 初期位置の目安（重ならないよう少しずらす）
const lsGet=()=>{try{return JSON.parse(localStorage.getItem("busPos")||"{}")}catch(e){return {}}};
const lsSet=v=>{try{localStorage.setItem("busPos",JSON.stringify(v))}catch(e){}};
function posOf(no,saved,fixed){
  if(saved[no]) return saved[no];
  if(fixed[no]) return fixed[no];
  const i=DATA.stop_info[no],o=OFFS[no]||[0,0];
  return [i.lat+o[0],i.lon+o[1]];
}
function dumpPos(){
  const o={};for(const [n,m] of Object.entries(markers)){const p=m.getLatLng();o[n]=[+p.lat.toFixed(6),+p.lng.toFixed(6)]}
  document.getElementById("posOut").value=JSON.stringify(o);
}
async function initMap(){
  const info=DATA.stop_info;
  document.getElementById("legend").innerHTML=Object.entries(info).map(([n,i])=>
    `<div class="legend"><div class="no">${n}</div><div><b>${i.name}</b> ${i.landmark?"・"+i.landmark:""}${i.from?"（"+i.from+"から来るバス）":""}</div></div>`).join("");
  let fixed={};try{fixed=await (await fetch("positions.json?"+Date.now())).json()}catch(e){}
  const saved=lsGet();
  const pts=Object.keys(info).map(n=>posOf(n,saved,fixed));
  map=L.map("map",{scrollWheelZoom:false});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  map.fitBounds(L.latLngBounds(pts).pad(.3),{maxZoom:18});
  Object.keys(info).forEach((n,k)=>{
    const m=L.marker(pts[k],{draggable:false,icon:L.divIcon({className:"",html:`<div class="pin">${n}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
    m.on("dragend",()=>{const s=lsGet();s[n]=[m.getLatLng().lat,m.getLatLng().lng];lsSet(s);dumpPos()});
    markers[n]=m;
  });
  document.getElementById("editBtn").onclick=()=>{
    editing=!editing;
    document.getElementById("editBox").hidden=!editing;
    document.getElementById("map").classList.toggle("edit",editing);
    document.getElementById("editBtn").textContent=editing?"調整を終える":"位置を調整";
    Object.values(markers).forEach(m=>editing?m.dragging.enable():m.dragging.disable());
    dumpPos();
  };
  document.getElementById("resetBtn").onclick=()=>{lsSet({});location.reload()};
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  try{initMap()}catch(e){}
  timeEl.value=jstNow().time;
  document.getElementById("meta").textContent="時刻表更新: "+d.updated;
  document.getElementById("stops").innerHTML="出典: 国際興業バス時刻表（NAVITIME）。赤羽駅に行かない便は除外。";
  render();
}).catch(()=>{document.getElementById("list").innerHTML='<div class="empty">時刻表データを読み込めませんでした</div>'});
</script>
</body>
</html>
